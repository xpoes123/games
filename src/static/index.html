<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>games</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>games</h1>

    <section id="entry">
      <label>name <input id="player-name" maxlength="24" autocomplete="off" autofocus /></label>
      <button id="join-btn">join</button>
      <div id="entry-status"></div>
    </section>

    <section id="game" hidden>
      <div class="game-head">
        <div id="seat-status"></div>
        <div class="actions">
          <button id="deal-btn" disabled>deal</button>
          <button id="leave-btn">leave</button>
        </div>
      </div>

      <div id="table">
        <div class="seat bottom"><div class="name"></div><div class="hand"></div></div>
        <div class="seat left"><div class="name"></div><div class="hand"></div></div>
        <div class="seat top"><div class="name"></div><div class="hand"></div></div>
        <div class="seat right"><div class="name"></div><div class="hand"></div></div>
        <div id="deck"></div>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
