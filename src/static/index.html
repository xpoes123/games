<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>games</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>games</h1>

    <div id="lobby">
      <section>
        <h2>new room</h2>
        <button id="create-btn">create</button>
      </section>

      <section>
        <h2>join room</h2>
        <label>code <input id="join-code" maxlength="4" autocomplete="off" /></label>
        <label>name <input id="player-name" maxlength="24" autocomplete="off" /></label>
        <button id="join-btn">join</button>
      </section>
    </div>

    <section id="room" hidden>
      <div class="room-head">
        <h2>room <span id="room-code"></span></h2>
        <button id="leave-btn">leave</button>
      </div>
      <ul id="players"></ul>
      <div id="chat-log"></div>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" />
        <button type="submit">send</button>
      </form>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
