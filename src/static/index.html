<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>games</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>games</h1>

    <section id="entry">
      <label>name <input id="player-name" maxlength="24" autocomplete="off" autofocus /></label>
      <button id="join-btn">join</button>
      <div id="entry-status"></div>
    </section>

    <section id="game" hidden>
      <div class="game-head">
        <div id="seat-status"></div>
        <div class="actions">
          <button id="deal-btn" disabled>deal</button>
          <button id="leave-btn">leave</button>
        </div>
      </div>

      <div id="table">
        <div class="seat bottom"><div class="name"></div><div class="hand"></div></div>
        <div class="seat left"><div class="name"></div><div class="hand"></div></div>
        <div class="seat top"><div class="name"></div><div class="hand"></div></div>
        <div class="seat right"><div class="name"></div><div class="hand"></div></div>
        <div id="deck"></div>
        <div id="play-area">
          <div class="play-slot" data-pos="bottom"></div>
          <div class="play-slot" data-pos="left"></div>
          <div class="play-slot" data-pos="top"></div>
          <div class="play-slot" data-pos="right"></div>
        </div>
      </div>

      <div id="bid-area" hidden>
        <div id="bid-info"></div>
        <div id="bid-panel" hidden>
          <label>level
            <select id="bid-level">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
            </select>
          </label>
          <label>strain
            <select id="bid-strain">
              <option value="NT">NT</option>
              <option value="C">♣</option>
              <option value="D">♦</option>
              <option value="H">♥</option>
              <option value="S">♠</option>
            </select>
          </label>
          <button id="bid-submit">bid</button>
          <button id="bid-pass">pass</button>
          <div id="bid-error"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
