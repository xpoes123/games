<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>games</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <h1>games</h1>

    <div id="lobby">
      <section>
        <h2>new room</h2>
        <button id="create-btn">create</button>
      </section>

      <section>
        <h2>join room</h2>
        <label>code <input id="join-code" maxlength="4" autocomplete="off" /></label>
        <label>name <input id="player-name" maxlength="24" autocomplete="off" /></label>
        <button id="join-btn">join</button>
      </section>
    </div>

    <section id="room" hidden>
      <div class="room-head">
        <span>room <span id="room-code"></span></span>
        <div class="actions">
          <button id="deal-btn" disabled>deal</button>
          <button id="leave-btn">leave</button>
        </div>
      </div>

      <div id="table">
        <div class="seat bottom" data-pos="bottom"><div class="name"></div><div class="hand"></div></div>
        <div class="seat left"   data-pos="left"><div class="name"></div><div class="hand"></div></div>
        <div class="seat top"    data-pos="top"><div class="name"></div><div class="hand"></div></div>
        <div class="seat right"  data-pos="right"><div class="name"></div><div class="hand"></div></div>
        <div id="deck"></div>
      </div>

      <div id="room-status"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
