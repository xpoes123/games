<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chess — replay</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1a1b26; --fg: #c0caf5; --muted: #565f89; --border: #414868;
      --accent: #7aa2f7; --panel: #24283b;
      --sq-light: #2a2e44; --sq-dark: #1f2235;
      --w-piece: #e0e0ee; --b-piece: #1c1d28;
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
    main { max-width: 980px; margin: 0 auto; padding: 1.5rem 1rem; }
    header { display: flex; gap: 1rem; align-items: baseline; margin-bottom: 1rem; }
    h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
    .meta { color: var(--muted); font-size: 0.8rem; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px;
      gap: 1.25rem; align-items: start; }

    #board-host { display: flex; flex-direction: column; gap: 0.5rem; }
    .side-row { display: flex; justify-content: space-between; color: var(--muted);
      font-size: 0.85rem; padding: 0.1rem 0.25rem; }
    .side-row .name { color: var(--fg); }
    .side-row.active .name { color: var(--accent); }

    #board { display: grid; grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr); aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      width: 100%; max-width: min(70vh, 100%); margin: 0 auto; }
    .sq { position: relative; display: flex; align-items: center;
      justify-content: center; font-size: 2.4rem; line-height: 1;
      user-select: none; }
    .sq.light { background: var(--sq-light); }
    .sq.dark { background: var(--sq-dark); }
    .sq.last-from { box-shadow: inset 0 0 0 2px rgba(122,162,247,0.4); }
    .sq.last-to { box-shadow: inset 0 0 0 2px rgba(122,162,247,0.85); }
    .piece.w { color: var(--w-piece); }
    .piece.b { color: var(--b-piece); text-shadow: 0 0 1px rgba(255,255,255,0.6); }
    .sq .coord { position: absolute; bottom: 1px; right: 2px; font-size: 0.55rem;
      color: var(--muted); pointer-events: none; }

    .controls { display: flex; gap: 0.5rem; align-items: center;
      padding: 0.6rem 0.4rem; border-top: 1px solid var(--border); }
    .controls button { background: transparent; border: 1px solid var(--border);
      color: var(--fg); padding: 0.3rem 0.7rem; cursor: pointer; font: inherit; }
    .controls button:hover { border-color: var(--accent); }
    .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
    .controls .spacer { flex: 1; }
    .step-readout { color: var(--muted); font-variant-numeric: tabular-nums; }

    aside { border: 1px solid var(--border); background: var(--panel);
      padding: 0.75rem 0.85rem; max-height: 70vh; overflow-y: auto; }
    aside h2 { font-size: 0.85rem; color: var(--muted); margin: 0 0 0.5rem;
      font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; }
    .events { display: flex; flex-direction: column; gap: 0.15rem;
      font-size: 0.8rem; }
    .events .ev { padding: 0.15rem 0.3rem; }
    .events .ev.cur { background: rgba(122,162,247,0.18);
      box-shadow: inset 2px 0 0 var(--accent); }
    .events .ev.past { color: var(--muted); }
    .events .ev .who { color: var(--accent); margin-right: 0.35em; }
    .events .ev.b .who { color: #f7768e; }

    .footer-links { margin-top: 1rem; color: var(--muted); font-size: 0.8rem; }
    .footer-links a { color: var(--accent); text-decoration: none; }
    .footer-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>replay</h1>
      <span class="meta" id="game-meta">loading…</span>
    </header>

    <div class="layout">
      <div id="board-host">
        <div class="side-row" id="row-black">
          <span class="name" id="black-name">—</span>
          <span class="setup" id="black-setup"></span>
        </div>
        <div id="board"></div>
        <div class="side-row" id="row-white">
          <span class="name" id="white-name">—</span>
          <span class="setup" id="white-setup"></span>
        </div>
        <div class="controls">
          <button id="btn-start" title="Jump to start (Home)">⏮</button>
          <button id="btn-prev" title="Step back (←)">◀</button>
          <button id="btn-play" title="Play / pause (Space)">▶</button>
          <button id="btn-next" title="Step forward (→)">▶|</button>
          <button id="btn-end" title="Jump to end (End)">⏭</button>
          <span class="spacer"></span>
          <label>speed
            <select id="speed">
              <option value="800">0.5×</option>
              <option value="400" selected>1×</option>
              <option value="200">2×</option>
              <option value="80">5×</option>
            </select>
          </label>
          <span class="step-readout" id="step-readout">0 / 0</span>
        </div>
      </div>

      <aside>
        <h2>events</h2>
        <div class="events" id="events"></div>
      </aside>
    </div>

    <p class="footer-links">
      <a href="/chess/games">← past games</a> · <a href="/chess/">play</a>
    </p>
  </main>

  <script src="/chess/static/replay.js"></script>
</body>
</html>
