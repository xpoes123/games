<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>chess — past games</title>
  <link rel="stylesheet" href="/chess/static/style.css" />
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    main { max-width: 760px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.2rem; margin: 0 0 1rem; }
    .filter-row { display: flex; gap: 0.75rem; align-items: center;
      margin-bottom: 1.25rem; font-size: 0.85rem; color: var(--muted, #565f89); }
    .filter-row button { background: transparent; border: 1px solid var(--border, #414868);
      color: var(--fg, #c0caf5); padding: 0.25rem 0.65rem; cursor: pointer; font: inherit; }
    .filter-row button.active { border-color: var(--accent, #7aa2f7); color: var(--accent, #7aa2f7); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.55rem 0.5rem; border-bottom: 1px solid var(--border, #414868);
      font-size: 0.85rem; }
    th { color: var(--muted, #565f89); font-weight: 500; }
    td.slug a { color: var(--accent, #7aa2f7); text-decoration: none; font-variant-numeric: tabular-nums; }
    td.slug a:hover { text-decoration: underline; }
    td.winner.w { color: #e0af68; }
    td.winner.b { color: #9ece6a; }
    .delta { font-variant-numeric: tabular-nums; }
    .delta.pos { color: #9ece6a; }
    .delta.neg { color: #f7768e; }
    .empty { padding: 2rem 0; color: var(--muted, #565f89); text-align: center; }
    .hint { color: var(--muted, #565f89); font-size: 0.8rem; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>past games</h1>
    <div class="filter-row">
      <span>show:</span>
      <button id="filter-all" class="active">all</button>
      <button id="filter-mine">just mine</button>
      <span id="count"></span>
    </div>
    <div id="table-host"></div>
    <p class="hint">
      <a href="/chess/leaderboard">leaderboard</a> ·
      <a href="/chess/">back to lobby</a> ·
      <a href="/">all games</a>
    </p>
  </main>
  <script src="/chess/static/games.js"></script>
</body>
</html>
