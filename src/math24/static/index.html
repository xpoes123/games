<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>math 24</title>
<style>
  :root { color-scheme: dark; --bg:#1a1b26; --fg:#c0caf5; --muted:#565f89;
          --border:#414868; --accent:#7aa2f7; --panel:#24283b; --good:#9ece6a; --bad:#f7768e; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
         background:var(--bg); color:var(--fg); font-size:14px; }
  main { max-width:640px; margin:0 auto; padding:2rem 1.25rem; }
  h1 { font-size:1.3rem; font-weight:600; margin:0 0 1.25rem; }
  input, button { font:inherit; }
  input { background:var(--panel); border:1px solid var(--border); color:var(--fg); padding:.5rem .6rem; }
  button { background:var(--panel); border:1px solid var(--border); color:var(--fg); padding:.5rem .9rem; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; }
  .hidden { display:none; }
  #auth { text-align:right; min-height:1.4em; color:var(--muted); }
  #auth a { color:var(--accent); }
  #nums { display:flex; gap:.75rem; justify-content:center; margin:2rem 0 1.25rem; }
  #nums span { font-size:2.6rem; font-weight:700; background:var(--panel); border:1px solid var(--border);
               width:4rem; height:4rem; display:flex; align-items:center; justify-content:center; }
  #expr { width:100%; font-size:1.2rem; text-align:center; }
  #players { list-style:none; padding:0; margin:1rem 0; display:grid; gap:.4rem; }
  #players li { padding:.5rem .75rem; background:var(--panel); border:1px solid var(--border);
                display:flex; justify-content:space-between; }
  #status { min-height:1.4em; margin-top:1rem; color:var(--muted); }
  details { margin-top:1rem; border:1px solid var(--border); padding:.5rem .75rem; }
  summary { cursor:pointer; color:var(--accent); }
  #boardList { margin:.6rem 0 0; padding-left:1.5rem; }
  #boardList .meta { color:var(--muted); }
  #pb { color:var(--muted); margin-top:1rem; }
</style>
</head>
<body>
<main>
  <div id="auth"></div>
  <h1>math 24</h1>

  <div id="join" class="row">
    <input id="name" placeholder="name" maxlength="24" />
    <input id="code" placeholder="room code (blank = new)" maxlength="4" style="width:11ch" />
    <button id="joinBtn">join</button>
  </div>

  <div id="game" class="hidden">
    <div class="row"><strong>room <span id="roomCode"></span></strong>
      <span style="color:var(--muted)">share the code to race</span></div>
    <p style="color:var(--muted)">Make <b>24</b> using all four numbers with + − × ÷ and parentheses.</p>
    <div id="nums"></div>
    <div class="row">
      <input id="expr" placeholder="e.g. 6/(1-3/4)" autocomplete="off" />
    </div>
    <div class="row" style="margin-top:.5rem">
      <button id="submit">submit (enter)</button>
      <button id="next">next puzzle</button>
    </div>
    <div id="status"></div>
    <ul id="players"></ul>
    <div id="pb"></div>
    <details id="board"><summary>leaderboard</summary><ol id="boardList"></ol></details>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
let ws;

function status(msg, cls) { $("#status").textContent = msg; $("#status").style.color =
  cls === "good" ? "var(--good)" : cls === "bad" ? "var(--bad)" : "var(--muted)"; }

function render(m) {
  $("#roomCode").textContent = m.code;
  $("#nums").innerHTML = "";
  m.numbers.forEach(n => { const s = document.createElement("span"); s.textContent = n; $("#nums").appendChild(s); });
  $("#players").innerHTML = "";
  m.players.forEach(p => { const li = document.createElement("li");
    li.innerHTML = `<span>${p.name}</span><span>${p.score}</span>`; $("#players").appendChild(li); });
  $("#submit").disabled = m.round_over;
  $("#expr").disabled = m.round_over;
  if (m.round_over) status(`${m.winner} got it: ${m.expr}  —  hit "next puzzle"`, "good");
  else { status(""); }
}

async function fetchAuth() {
  try { const m = await (await fetch("/auth/me")).json(); const el = $("#auth");
    if (m.authenticated) el.innerHTML = `${m.user.username} · <a href="/auth/logout">logout</a>`;
    else if (m.oauth) el.innerHTML = `<a href="/auth/discord/login">login with Discord</a>`;
    else el.textContent = "playing as guest"; } catch {}
}
async function fetchBoards() {
  try {
    const lb = (await (await fetch("/api/leaderboard?game=math24")).json()).leaderboard || [];
    const ol = $("#boardList"); ol.innerHTML = lb.length ? "" : '<li class="meta">no games yet</li>';
    lb.forEach(e => { const li = document.createElement("li");
      li.innerHTML = `${e.name}${e.is_account ? "" : " (guest)"} <span class="meta">— ${e.wins}W / ${e.games}</span>`;
      ol.appendChild(li); });
    const prof = (await (await fetch("/api/profile?game=math24")).json()).profile;
    $("#pb").textContent = (prof && prof.games) ? `your record — ${prof.wins}/${prof.games} round wins` : "";
  } catch {}
}

$("#joinBtn").onclick = () => {
  const name = $("#name").value.trim() || "anon";
  const code = $("#code").value.trim().toUpperCase();
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/math24/ws");
  ws.onopen = () => ws.send(JSON.stringify({ type: "hello", name, code }));
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "joined") { $("#join").classList.add("hidden"); $("#game").classList.remove("hidden");
      fetchBoards(); }
    else if (m.type === "state") render(m);
    else if (m.type === "invalid") status(m.reason, "bad");
    else if (m.type === "round_won") { fetchBoards(); }
  };
  ws.onclose = () => status("disconnected", "bad");
};

$("#submit").onclick = () => { const e = $("#expr").value.trim();
  if (e) ws.send(JSON.stringify({ type: "submit", expr: e })); };
$("#next").onclick = () => { $("#expr").value = ""; ws.send(JSON.stringify({ type: "next" })); };
$("#expr").addEventListener("keydown", e => { if (e.key === "Enter") $("#submit").onclick(); });
fetchAuth();
</script>
</body>
</html>
