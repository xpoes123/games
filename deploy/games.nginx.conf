# nginx reverse-proxy config for games.djiang.xyz.
# Drop into /etc/nginx/sites-available/games and symlink into sites-enabled,
# then reload nginx. TLS via certbot:
#   sudo certbot --nginx -d games.djiang.xyz

server {
    listen 80;
    server_name games.djiang.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name games.djiang.xyz;

    # Filled in by certbot:
    # ssl_certificate     /etc/letsencrypt/live/games.djiang.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/games.djiang.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:7781;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for /ws/* endpoints.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
